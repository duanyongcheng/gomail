name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty to use mygo.config.ts version for artifact-only build."
        required: false
        type: string
      publish_release:
        description: "Create/publish a GitHub Release for the tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
            publish="true"
          else
            tag="${INPUT_TAG:-}"
            publish="${INPUT_PUBLISH:-false}"
          fi

          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid tag format: $tag (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
            version="${tag#v}"
          else
            if [[ "$publish" == "true" ]]; then
              echo "A release tag (e.g. v0.1.0) is required when publish_release is true." >&2
              exit 1
            fi
            version="$(sed -nE 's/.*\|\| "([0-9]+\.[0-9]+\.[0-9]+[^"]*)".*/\1/p' mygo.config.ts | head -n 1)"
            if [[ -z "$version" ]]; then
              version="0.1.0"
            fi
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'should_publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS (arm64 + amd64)
    needs: prepare
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      PEBBLE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS bundles, DMGs, and signed updates
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -o build -sign - -skip-notarize

      - name: Verify app bundle signatures
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "build/darwin-arm64/Pebble Go.app"
          codesign --verify --deep --strict "build/darwin-amd64/Pebble Go.app"

      - name: Collect macOS release artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-release
          for target in darwin-arm64 darwin-amd64; do
            files=(
              build/"$target"/*.dmg
              build/"$target"/*.tar.gz
              build/"$target"/*.delta
              build/"$target"/update-*.json
            )
            if [[ "${#files[@]}" -gt 0 ]]; then
              cp "${files[@]}" dist-release/
            fi
          done
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: pebble-go-macos
          path: dist-release/*
          if-no-files-found: error

  windows:
    name: Build Windows (amd64 + arm64)
    needs: prepare
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      PEBBLE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows NSIS installers and signed updates
        run: go tool mygo build -platform windows/amd64,windows/arm64 -o build

      - name: Collect Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          foreach ($target in @("windows-amd64", "windows-arm64")) {
            foreach ($pattern in @("*Setup*.exe", "*.tar.gz", "*.delta", "update-*.json")) {
              Get-ChildItem -Path "build/$target/$pattern" -ErrorAction SilentlyContinue | Copy-Item -Destination dist-release/
            }
          }
          Get-ChildItem dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: pebble-go-windows
          path: dist-release/*
          if-no-files-found: error

  linux:
    name: Build Linux (amd64 + arm64)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      PEBBLE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux packages and signed updates
        run: go tool mygo build -platform linux/amd64,linux/arm64 -o build

      - name: Collect Linux release artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-release
          for target in linux-amd64 linux-arm64; do
            files=(
              build/"$target"/*.deb
              build/"$target"/*.tar.gz
              build/"$target"/*.delta
              build/"$target"/update-*.json
            )
            if [[ "${#files[@]}" -gt 0 ]]; then
              cp "${files[@]}" dist-release/
            fi
          done
          if [[ -f build/linux-amd64/install.sh ]]; then
            cp build/linux-amd64/install.sh dist-release/install.sh
          fi
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: pebble-go-linux
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, macos, windows, linux]
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate and verify SHA-256 checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(*.dmg)
          exes=(*.exe)
          debs=(*.deb)
          tarballs=(*.tar.gz)
          deltas=(*.delta)
          manifests=(update-*.json)
          scripts=(install.sh)
          if [[ "${#dmgs[@]}" -lt 2 || "${#exes[@]}" -lt 2 || "${#debs[@]}" -lt 2 || "${#tarballs[@]}" -lt 6 || "${#manifests[@]}" -lt 6 ]]; then
            echo "Missing expected platform or updater artifacts (dmg=${#dmgs[@]}, exe=${#exes[@]}, deb=${#debs[@]}, tar.gz=${#tarballs[@]}, manifests=${#manifests[@]})" >&2
            ls -la
            exit 1
          fi
          files=("${dmgs[@]}" "${exes[@]}" "${debs[@]}" "${tarballs[@]}" "${deltas[@]}" "${manifests[@]}" "${scripts[@]}")
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --draft \
              --title "Pebble Go $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber --repo "$GH_REPO"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
